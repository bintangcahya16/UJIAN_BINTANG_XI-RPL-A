<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peminjaman Alat Praktik</title>
  <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Sistem Peminjaman Alat Praktik</h1>

    <!-- Form Peminjaman -->
    <div class="bg-white p-5 rounded-lg shadow mb-6">
      <h2 class="text-xl font-semibold mb-3">Form Peminjaman</h2>
      <form id="formPinjam" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <select id="id_alat" class="border p-2 rounded" required></select>
        <input id="nama_peminjam" type="text" placeholder="Nama peminjam" class="border p-2 rounded" required>
        <input id="kelas" type="text" placeholder="Kelas" class="border p-2 rounded" required>
        <input id="jumlah" type="number" min="1" placeholder="Jumlah" class="border p-2 rounded" required>
        <button type="submit" class="bg-blue-600 text-white py-2 rounded hover:bg-blue-700 md:col-span-2">Pinjam</button>
      </form>
      <p id="pesan" class="mt-3 text-sm"></p>
    </div>

    <!-- Daftar Alat -->
    <div class="bg-white p-5 rounded-lg shadow mb-6 overflow-x-auto">
      <h2 class="text-xl font-semibold mb-3">Daftar Alat</h2>
      <table class="w-full text-left">
        <thead class="bg-gray-200">
          <tr>
            <th class="p-2">Nama Alat</th><th class="p-2">Kategori</th>
            <th class="p-2">Kondisi</th><th class="p-2">Stok</th><th class="p-2">Lokasi</th>
          </tr>
        </thead>
        <tbody id="tabelAlat"></tbody>
      </table>
    </div>

    <!-- Riwayat Peminjaman -->
    <div class="bg-white p-5 rounded-lg shadow overflow-x-auto">
      <h2 class="text-xl font-semibold mb-3">Riwayat Peminjaman</h2>
      <table class="w-full text-left">
        <thead class="bg-gray-200">
          <tr>
            <th class="p-2">Peminjam</th><th class="p-2">Kelas</th><th class="p-2">Alat</th>
            <th class="p-2">Jumlah</th><th class="p-2">Tgl Pinjam</th>
            <th class="p-2">Status</th><th class="p-2">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelPinjam"></tbody>
      </table>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
